<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>BeamForge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset=".45" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="kerf" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="80" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset=".55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#f97316" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- workpiece -->
  <rect x="64" y="368" width="384" height="24" rx="6" fill="#334155"/>

  <!-- glow at the cut point -->
  <circle cx="256" cy="368" r="120" fill="url(#glow)"/>

  <!-- kerf: the line already cut, trailing left -->
  <path d="M256 368 H96" stroke="url(#kerf)" stroke-width="16" stroke-linecap="round"/>

  <!-- beam -->
  <path d="M256 196 V362" stroke="#ef4444" stroke-opacity=".45" stroke-width="40" stroke-linecap="round"/>
  <path d="M256 196 V362" stroke="#f97316" stroke-width="20" stroke-linecap="round"/>
  <path d="M256 196 V362" stroke="#fff7ed" stroke-width="8" stroke-linecap="round"/>

  <!-- laser head -->
  <path d="M176 72 H336 V132 L292 196 H220 L176 132 Z" fill="url(#head)"/>
  <rect x="176" y="108" width="160" height="24" fill="#2563eb"/>

  <!-- spark -->
  <path d="M256 320 L268 356 L304 368 L268 380 L256 416 L244 380 L208 368 L244 356 Z" fill="#fffbeb"/>
</svg>
